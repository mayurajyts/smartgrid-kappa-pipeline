# =============================================================================
# EC8202 Smart Grid Kappa Pipeline — Phase 0 (infrastructure)
#
# Docker Compose is assessed directly under reproducibility (plan §3, §13): the
# marker must reach a working stack from a clean clone with one command. Every
# host, port, credential and topic setting below comes from `.env`, so nothing
# here assumes anything about the machine it runs on.
#
# PHASE 0 SCOPE: Kafka (the log), Postgres (the serving store), an
# S3-compatible object store (the curated archive), plus the one-shot init
# containers that create topics and buckets. Simulators, Spark, Airflow, the API and the observability stack are
# added in Phases 1-6.
#
# STARTUP ORDERING: the init containers use `depends_on: condition:
# service_healthy` rather than plain `depends_on`. Plain depends_on only waits
# for the container to START, not to become usable, which on a cold machine
# means topic creation races the broker and `make up` succeeds or fails
# depending on host speed. A checkpoint that passes intermittently is not a
# checkpoint.
# =============================================================================

name: smartgrid

services:
  # ---------------------------------------------------------------------------
  # Kafka — the immutable, replayable log. This IS the architecture (§3), not a
  # queue: Kappa's single-codebase replay story depends on offset-addressable
  # durable storage, and the stream-static join depends on log compaction.
  #
  # KRaft mode (no ZooKeeper): one fewer container, and matches current Kafka
  # releases where ZooKeeper is removed.
  #
  # TRADE-OFF (deliberate, and stated in the report's limitations section):
  # a SINGLE broker with replication factor 1. There is no fault tolerance —
  # losing this container loses the log. Acceptable for a demonstration,
  # unacceptable in production, where §12 calls for >= 3 brokers with
  # replication >= 3.
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: smartgrid-kafka
    ports:
      # Only the external listener is published. Containers reach the broker on
      # the compose network at kafka:9092 without going through the host.
      - "${KAFKA_HOST_PORT}:29092"
    environment:
      # --- KRaft: this node is both controller and broker ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Fixed cluster id: a generated one would change on every `make clean`,
      # and a stale id in a surviving volume is an unhelpful startup failure.
      CLUSTER_ID: smartgrid-kappa-cluster-1

      # --- Listeners ---
      # Two listeners are required because the advertised address differs by
      # caller: containers resolve `kafka`, host tools resolve `localhost`.
      # Advertising only one is the classic "works in-container, times out from
      # the host" failure.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single-broker settings ---
      # All of these default to 3 and would leave the broker unable to create
      # its internal topics on a one-node cluster.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Auto-creation OFF, deliberately. Auto-created topics get Kafka's
      # defaults: 1 partition and delete-retention — wrong on both counts here.
      # A typo in a topic name must fail loudly, not silently create a
      # single-partition topic that quietly breaks zone ordering.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # No compaction on the tariff topic can happen until the cleaner is on.
      KAFKA_LOG_CLEANER_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Listing topics proves the broker is accepting admin requests, which is
      # what kafka-init actually needs — stronger than a TCP port check.
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot: create topics with the partition and compaction settings the
  # architecture depends on, then exit. See docker/kafka-init/create_topics.sh
  # for why each setting is load-bearing.
  # ---------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: smartgrid-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TOPIC_METER_READINGS: ${TOPIC_METER_READINGS}
      TOPIC_METER_READINGS_CLEAN: ${TOPIC_METER_READINGS_CLEAN}
      TOPIC_METER_READINGS_DLQ: ${TOPIC_METER_READINGS_DLQ}
      TOPIC_TARIFF_REFERENCE: ${TOPIC_TARIFF_REFERENCE}
      TOPIC_WEATHER_FORECAST: ${TOPIC_WEATHER_FORECAST}
      TOPIC_METER_PARTITIONS: ${TOPIC_METER_PARTITIONS}
      TOPIC_REFERENCE_PARTITIONS: ${TOPIC_REFERENCE_PARTITIONS}
      TOPIC_REPLICATION_FACTOR: ${TOPIC_REPLICATION_FACTOR}
      TOPIC_METER_RETENTION_MS: ${TOPIC_METER_RETENTION_MS}
    volumes:
      - ./docker/kafka-init/create_topics.sh:/opt/create_topics.sh:ro
    entrypoint: ["bash", "/opt/create_topics.sh"]
    # Not `unless-stopped`: this is a task, not a service. It must run to
    # completion and stay exited, or `make ps` would show it perpetually
    # restarting and obscure whether the checkpoint actually passed.
    restart: "no"

  # ---------------------------------------------------------------------------
  # PostgreSQL — serving store (§3): low-latency point lookups, small range
  # scans over 1-minute windows, and the transactional multi-row swap that makes
  # bill restatement atomic. Also hosts Airflow's metadata in a separate
  # database (see docker/postgres/init/01_create_databases.sh for the
  # isolation trade-off).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: smartgrid-postgres
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # The superuser's own database. The application databases are created by
      # the init script below; keeping them separate from POSTGRES_DB means the
      # app never connects as superuser.
      POSTGRES_DB: postgres
      # Consumed by the init script:
      SMARTGRID_DB: ${POSTGRES_DB}
      SMARTGRID_USER: ${POSTGRES_USER}
      SMARTGRID_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_POSTGRES_DB}
      AIRFLOW_USER: ${AIRFLOW_POSTGRES_USER}
      AIRFLOW_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts here run ONLY when the data directory is empty, i.e. on first
      # boot and after `make clean`. An ordinary restart does not re-run them.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # The serving DDL, read by 02_serving_schema.sh above. Mounted rather than
      # inlined into that script so serving/sql/001_schema.sql stays the single
      # definition of the schema -- `make serving-schema` pipes the same file to a
      # RUNNING instance, which is the path that matters for anyone whose
      # postgres-data volume predates Phase 3 (the init hook only fires on an
      # empty volume).
      - ./serving/sql:/opt/serving:ro
    healthcheck:
      # Checks the SERVING database specifically, not just the server: the
      # server accepts connections before the init script has finished creating
      # `smartgrid`, and a dependent service starting in that gap would fail.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SeaweedFS — S3-compatible object store for the curated Parquet archive (§3).
  #
  # SUBSTITUTION FROM THE PLAN, documented in docs/ADR-003-object-store.md:
  # the plan names MinIO. As of this build MinIO's images require registry
  # authentication on both Docker Hub and quay.io, which would break the
  # "reproducible from a clean clone" property that is directly assessed. The
  # architectural requirement is an S3-compatible object store, not MinIO
  # specifically, so SeaweedFS substitutes for it: a real distributed object
  # store with a genuine S3 gateway, pullable without credentials. Spark's s3a
  # write path in Phase 2 is identical either way.
  #
  # Chosen over HDFS for the same reason MinIO was: identical benefit at this
  # scale for far less operational weight in Compose, and the S3 API is what
  # production object storage exposes anyway.
  # ---------------------------------------------------------------------------
  objectstore:
    image: chrislusf/seaweedfs:3.80
    container_name: smartgrid-objectstore
    ports:
      - "${S3_API_HOST_PORT}:8333"     # S3 API
      - "${S3_CONSOLE_HOST_PORT}:8888" # Filer browser, used in the demo
    # `server -s3` runs master, volume, filer and the S3 gateway in one process.
    # Appropriate here for the same reason the single Kafka broker is: this is a
    # demonstration of an architecture, not a highly-available deployment.
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      # Identity config so SeaweedFS recognises the credentials Spark signs its
      # requests with. Without it, s3a PUTs fail with "Signed request requires
      # setting up SeaweedFS S3 authentication" - see the file's own comment.
      - -s3.config=/etc/seaweedfs/s3_config.json
      - -filer.port=8888
      - -master.volumeSizeLimitMB=64
    volumes:
      - objectstore-data:/data
      - ./docker/objectstore/s3_config.json:/etc/seaweedfs/s3_config.json:ro
    healthcheck:
      # Hits the S3 endpoint itself (ListBuckets), not just a TCP port, so the
      # init container only runs once the gateway is genuinely serving.
      #
      # 127.0.0.1 explicitly, NOT "localhost": SeaweedFS binds IPv4 only, while
      # localhost resolves to ::1 first in this image, so a localhost probe is
      # refused even though the gateway is healthy.
      #
      # `server -s3` starts master, then volume, then filer, then the S3
      # gateway, so the endpoint is unavailable for the first ~20s. The long
      # start_period covers that sequence; failures during it are not counted,
      # which keeps a cold start on a slow machine from being reported as a
      # failed checkpoint.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot: create the curated bucket, then exit.
  # ---------------------------------------------------------------------------
  objectstore-init:
    image: curlimages/curl:8.10.1
    container_name: smartgrid-objectstore-init
    depends_on:
      objectstore:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_CURATED_BUCKET: ${S3_CURATED_BUCKET}
    volumes:
      - ./docker/objectstore-init/create_buckets.sh:/opt/create_buckets.sh:ro
    entrypoint: ["/bin/sh", "/opt/create_buckets.sh"]
    restart: "no"


  # ===========================================================================
  # PHASE 1 - data sources
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Shared Python base image. Built once as a dependency of the three services
  # below so they provably run the same `common/` code - the single definition of
  # the config, the contracts, the log shape and the simulated clock.
  #
  # This is an image-only service: it runs a trivial command, exits 0, and the
  # others depend on it with `condition: service_completed_successfully` so the
  # image exists before they build on it.
  # ---------------------------------------------------------------------------
  base-image:
    build:
      context: .
      dockerfile: docker/base/Dockerfile
    image: smartgrid-base:latest
    container_name: smartgrid-base-image
    command: ["python", "-c", "print('base image built')"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Meter telemetry - the streaming source (section 4.1).
  #
  # ~200 meters emitting every 2 real seconds, keyed by grid_zone for per-zone
  # ordering. Injects the duplicates, late events, nulls, negative kWh and meter
  # dropout that Job A validation and the DLQ are built to catch.
  # ---------------------------------------------------------------------------
  meter-simulator:
    build:
      context: .
      dockerfile: docker/simulators/Dockerfile
    image: smartgrid-meter-simulator:latest
    container_name: smartgrid-meter-simulator
    depends_on:
      base-image:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      # Gated on topic creation COMPLETING, not merely on the broker being up.
      # Auto-creation is disabled on the broker, so a producer starting first
      # would fail every publish with UNKNOWN_TOPIC_OR_PART.
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "simulators.meter_simulator"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      TOPIC_METER_READINGS: ${TOPIC_METER_READINGS}
      SIM_START_DATE: ${SIM_START_DATE}
      SIM_ANCHOR_REAL: ${SIM_ANCHOR_REAL}
      SIM_DAY_REAL_SECONDS: ${SIM_DAY_REAL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      METRICS_PORT: ${METRICS_PORT}
      METER_TICK_REAL_SECONDS: ${METER_TICK_REAL_SECONDS}
      METER_LIMIT: ${METER_LIMIT}
      DEFAULT_SOLAR_INDEX: ${DEFAULT_SOLAR_INDEX}
      FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED}
      FAULT_RATE_NULL_FIELD: ${FAULT_RATE_NULL_FIELD}
      FAULT_RATE_NEGATIVE_KWH: ${FAULT_RATE_NEGATIVE_KWH}
      FAULT_RATE_SOLAR_SPIKE: ${FAULT_RATE_SOLAR_SPIKE}
      FAULT_RATE_FUTURE_TIMESTAMP: ${FAULT_RATE_FUTURE_TIMESTAMP}
      FAULT_RATE_DUPLICATE: ${FAULT_RATE_DUPLICATE}
      FAULT_RATE_LATE_EVENT: ${FAULT_RATE_LATE_EVENT}
      FAULT_LATE_EVENT_SIM_MINUTES: ${FAULT_LATE_EVENT_SIM_MINUTES}
      FAULT_FUTURE_TIMESTAMP_SIM_MINUTES: ${FAULT_FUTURE_TIMESTAMP_SIM_MINUTES}
      FAULT_RATE_METER_DROPOUT: ${FAULT_RATE_METER_DROPOUT}
      FAULT_METER_DROPOUT_REAL_SECONDS: ${FAULT_METER_DROPOUT_REAL_SECONDS}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Daily tariff + weather feed - the batch-shaped source (sections 4.1, 14).
  #
  # Writes files to the drop volume at each simulated day boundary, modelling a
  # real end-of-day utility feed. Day D tariff arrives when day D+1 begins, so
  # the first simulated day deliberately has no tariff - which is what exercises
  # the Job C "write running kWh with tariff_rate = NULL rather than guess" path.
  # ---------------------------------------------------------------------------
  tariff-simulator:
    build:
      context: .
      dockerfile: docker/simulators/Dockerfile
    image: smartgrid-meter-simulator:latest
    container_name: smartgrid-tariff-simulator
    depends_on:
      base-image:
        condition: service_completed_successfully
    command: ["python", "-m", "simulators.tariff_simulator"]
    environment:
      SIM_START_DATE: ${SIM_START_DATE}
      SIM_ANCHOR_REAL: ${SIM_ANCHOR_REAL}
      SIM_DAY_REAL_SECONDS: ${SIM_DAY_REAL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      METRICS_PORT: ${METRICS_PORT}
      DROP_DIR: ${DROP_DIR}
      SUBSIDY_SHARE: ${SUBSIDY_SHARE}
      OVERCAST_DAY_PROBABILITY: ${OVERCAST_DAY_PROBABILITY}
      SEED_PREVIOUS_DAY_ON_STARTUP: ${SEED_PREVIOUS_DAY_ON_STARTUP}
    volumes:
      - drop-data:/data/drop
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Batch loader - the file feed bridge into the log (section 4.1).
  #
  # This is what keeps the architecture Kappa rather than Lambda: the daily file
  # feed becomes keyed records on compacted topics, so the processing layer has
  # exactly one kind of input.
  # ---------------------------------------------------------------------------
  batch-loader:
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    image: smartgrid-batch-loader:latest
    container_name: smartgrid-batch-loader
    depends_on:
      base-image:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "ingestion.batch_loader"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      TOPIC_TARIFF_REFERENCE: ${TOPIC_TARIFF_REFERENCE}
      TOPIC_WEATHER_FORECAST: ${TOPIC_WEATHER_FORECAST}
      SIM_START_DATE: ${SIM_START_DATE}
      SIM_ANCHOR_REAL: ${SIM_ANCHOR_REAL}
      SIM_DAY_REAL_SECONDS: ${SIM_DAY_REAL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      METRICS_PORT: ${METRICS_PORT}
      DROP_DIR: ${DROP_DIR}
      PROCESSED_MARKER_DIR: ${PROCESSED_MARKER_DIR}
      LOADER_POLL_SECONDS: ${LOADER_POLL_SECONDS}
    volumes:
      # Read-write: the loader writes its processed-file markers under the drop
      # directory, in a dotted subdirectory so they are never mistaken for input.
      - drop-data:/data/drop
    restart: unless-stopped


  # ===========================================================================
  # PHASE 2 - Spark standalone cluster and Job A
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Spark master. A standalone cluster (not local mode) because section 4.2 asks
  # for one, and because it makes the submit/executor split visible in the demo -
  # the Spark UI showing a real job with real executors is part of what the
  # processing-layer criterion is assessed on.
  #
  # TRADE-OFF: a single worker means no real distribution, so this demonstrates the
  # architecture rather than its scalability. Honest in the report alongside the
  # single Kafka broker: both are demonstration-scale choices, not production ones.
  # ---------------------------------------------------------------------------
  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: smartgrid-spark:latest
    container_name: smartgrid-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
    healthcheck:
      # The master UI answering means the master has bound its RPC port and can
      # accept worker registrations - stronger than a bare TCP check.
      test: ["CMD", "curl", "-sf", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  spark-worker:
    image: smartgrid-spark:latest
    container_name: smartgrid-spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
    volumes:
      # The worker needs the checkpoint volume too: executors write state store
      # files there, not only the driver.
      - spark-checkpoints:/data/checkpoints
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Job A - clean and enrich (section 7).
  #
  # Submitted in CLIENT mode so the driver runs in this container: the driver is
  # where foreachBatch executes, where the structured JSON logs are emitted, and
  # where the Prometheus endpoint is served. In cluster mode the driver would move
  # to an arbitrary worker and `docker compose logs job-a` would show nothing -
  # which would gut the observability evidence this project is graded on.
  # ---------------------------------------------------------------------------
  job-a:
    image: smartgrid-spark:latest
    container_name: smartgrid-job-a
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Gated on topic creation completing: auto-creation is disabled on the
      # broker, so a consumer starting first fails with UNKNOWN_TOPIC_OR_PART.
      kafka-init:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --driver-memory
      - ${SPARK_DRIVER_MEMORY}
      - --executor-memory
      - ${SPARK_EXECUTOR_MEMORY}
      # One core per job. WITHOUT THIS a spark-submit claims every free core on
      # the worker, so whichever job starts first starves the others and they sit
      # in WAITING forever with no error -- the symptom is a job that logs
      # "Initial job has not accepted any resources" and never processes a batch,
      # which reads as a code hang rather than a scheduling problem.
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.driver.host=job-a
      - /app/processing/job_a_clean_enrich.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      TOPIC_METER_READINGS: ${TOPIC_METER_READINGS}
      TOPIC_METER_READINGS_CLEAN: ${TOPIC_METER_READINGS_CLEAN}
      TOPIC_METER_READINGS_DLQ: ${TOPIC_METER_READINGS_DLQ}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_CURATED_BUCKET: ${S3_CURATED_BUCKET}
      SIM_START_DATE: ${SIM_START_DATE}
      SIM_ANCHOR_REAL: ${SIM_ANCHOR_REAL}
      SIM_DAY_REAL_SECONDS: ${SIM_DAY_REAL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      METRICS_PORT: ${METRICS_PORT}
      DEDUPE_WATERMARK_REAL_MINUTES: ${DEDUPE_WATERMARK_REAL_MINUTES}
      # REAL minutes; the job converts by the compression ratio. Stated in
      # SIMULATED minutes until Phase 3, which rejected 100% of readings at fast
      # mode -- see the comment in processing/job_a_clean_enrich.py.
      FUTURE_TIMESTAMP_TOLERANCE_REAL_MINUTES: ${FUTURE_TIMESTAMP_TOLERANCE_REAL_MINUTES}
      TRIGGER_INTERVAL_SECONDS: ${TRIGGER_INTERVAL_SECONDS}
      CHECKPOINT_ROOT: ${CHECKPOINT_ROOT}
      PARQUET_PATH: ${PARQUET_PATH}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER}
      STARTING_OFFSETS: ${STARTING_OFFSETS}
      # Must match the producer's tick: the physical solar-capacity bound is
      # derived from it, so a mismatch would reject valid readings.
      METER_TICK_REAL_SECONDS: ${METER_TICK_REAL_SECONDS}
    volumes:
      # A named volume, so checkpoints SURVIVE a container restart. This is what
      # makes the Phase 2 checkpoint ("restarting the job does not duplicate
      # Parquet output") testable at all - a container-local path would be lost on
      # restart and the job would reprocess from the start of the topic.
      - spark-checkpoints:/data/checkpoints
      # The curated Parquet archive. On a volume rather than the S3 store because
      # the S3A committer's rename-based commit is unsupported by the object
      # store's gateway - see docs/ADR-004-parquet-sink.md.
      - curated-archive:/data/curated
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Job B -- zone aggregates (R1, R2). Reads job-a's clean topic, writes
  # zone_load_1m. See the module docstring for why the window is 288 SIMULATED
  # minutes rather than the 1 minute section 7 says literally.
  # --------------------------------------------------------------------------
  job-b:
    image: smartgrid-spark:latest
    container_name: smartgrid-job-b
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      # NOT required by job-a, but essential here: the sink is Postgres, so the
      # serving store must be accepting connections before the first micro-batch
      # completes. The healthcheck targets the SERVING database specifically, so
      # this also implies the init scripts have finished creating it.
      postgres:
        condition: service_healthy
      # NOTE: this job consumes job-a's OUTPUT topic. That is deliberately NOT a
      # depends_on -- job-a is long-lived and never "completes", so compose has no
      # condition that would express it. With STARTING_OFFSETS=latest this job
      # simply sees nothing until job-a produces, which is correct behaviour
      # rather than a race.
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --driver-memory
      - ${SPARK_DRIVER_MEMORY}
      - --executor-memory
      - ${SPARK_EXECUTOR_MEMORY}
      # One core per job. WITHOUT THIS a spark-submit claims every free core on
      # the worker, so whichever job starts first starves the others and they sit
      # in WAITING forever with no error -- the symptom is a job that logs
      # "Initial job has not accepted any resources" and never processes a batch,
      # which reads as a code hang rather than a scheduling problem.
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.driver.host=job-b
      - /app/processing/job_b_zone_aggregates.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      TOPIC_METER_READINGS_CLEAN: ${TOPIC_METER_READINGS_CLEAN}
      # Jobs B and C write to the serving store, which job-a does not -- hence the
      # POSTGRES_* block and the postgres dependency that job-a has no need of.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SIM_START_DATE: ${SIM_START_DATE}
      SIM_ANCHOR_REAL: ${SIM_ANCHOR_REAL}
      SIM_DAY_REAL_SECONDS: ${SIM_DAY_REAL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      METRICS_PORT: ${METRICS_PORT}
      CHECKPOINT_ROOT: ${CHECKPOINT_ROOT}
      TRIGGER_INTERVAL_SECONDS: ${TRIGGER_INTERVAL_SECONDS}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER}
      STARTING_OFFSETS: ${STARTING_OFFSETS}
      # Used with the compression ratio to size the batch event-time span that
      # the startup time-budget assertion checks the watermark against.
      METER_TICK_REAL_SECONDS: ${METER_TICK_REAL_SECONDS}
      # Both expressed in REAL minutes and multiplied by the 288x compression
      # ratio inside the job. A literal reading of section 7's "1 minute" would
      # be 0.21 real seconds -- see the Job B module docstring.
      ZONE_WINDOW_REAL_MINUTES: ${ZONE_WINDOW_REAL_MINUTES}
      ZONE_WATERMARK_REAL_MINUTES: ${ZONE_WATERMARK_REAL_MINUTES}
    volumes:
      - spark-checkpoints:/data/checkpoints
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Job C -- household billing (R5, R6). Stream-static join against the
  # compacted tariff topic; writes household_billing_running. Never writes
  # household_billing_daily -- that is Airflow's, in Phase 5.
  # --------------------------------------------------------------------------
  job-c:
    image: smartgrid-spark:latest
    container_name: smartgrid-job-c
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      # NOT required by job-a, but essential here: the sink is Postgres, so the
      # serving store must be accepting connections before the first micro-batch
      # completes. The healthcheck targets the SERVING database specifically, so
      # this also implies the init scripts have finished creating it.
      postgres:
        condition: service_healthy
      # NOTE: this job consumes job-a's OUTPUT topic. That is deliberately NOT a
      # depends_on -- job-a is long-lived and never "completes", so compose has no
      # condition that would express it. With STARTING_OFFSETS=latest this job
      # simply sees nothing until job-a produces, which is correct behaviour
      # rather than a race.
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --driver-memory
      - ${SPARK_DRIVER_MEMORY}
      - --executor-memory
      - ${SPARK_EXECUTOR_MEMORY}
      # One core per job. WITHOUT THIS a spark-submit claims every free core on
      # the worker, so whichever job starts first starves the others and they sit
      # in WAITING forever with no error -- the symptom is a job that logs
      # "Initial job has not accepted any resources" and never processes a batch,
      # which reads as a code hang rather than a scheduling problem.
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.driver.host=job-c
      - /app/processing/job_c_household_billing.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      TOPIC_METER_READINGS_CLEAN: ${TOPIC_METER_READINGS_CLEAN}
      # The compacted dimension the stream-static join reads each micro-batch.
      TOPIC_TARIFF_REFERENCE: ${TOPIC_TARIFF_REFERENCE}
      # Jobs B and C write to the serving store, which job-a does not -- hence the
      # POSTGRES_* block and the postgres dependency that job-a has no need of.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SIM_START_DATE: ${SIM_START_DATE}
      SIM_ANCHOR_REAL: ${SIM_ANCHOR_REAL}
      SIM_DAY_REAL_SECONDS: ${SIM_DAY_REAL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      METRICS_PORT: ${METRICS_PORT}
      CHECKPOINT_ROOT: ${CHECKPOINT_ROOT}
      TRIGGER_INTERVAL_SECONDS: ${TRIGGER_INTERVAL_SECONDS}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER}
      STARTING_OFFSETS: ${STARTING_OFFSETS}
      # Used with the compression ratio to size the batch event-time span that
      # the startup time-budget assertion checks the watermark against.
      METER_TICK_REAL_SECONDS: ${METER_TICK_REAL_SECONDS}
      BILLING_WATERMARK_REAL_MINUTES: ${BILLING_WATERMARK_REAL_MINUTES}
      # The block-rate ladder. Must stay consistent with the rates the tariff
      # simulator publishes; tests/unit/test_billing.py asserts they agree.
      BILLING_BLOCK_KWH: ${BILLING_BLOCK_KWH}
      BILLING_TIER_1_RATE: ${BILLING_TIER_1_RATE}
      BILLING_TIER_2_RATE: ${BILLING_TIER_2_RATE}
      BILLING_TIER_3_RATE: ${BILLING_TIER_3_RATE}
      BILLING_TIER_4_RATE: ${BILLING_TIER_4_RATE}
      BILLING_EXPORT_CREDIT_FRACTION: ${BILLING_EXPORT_CREDIT_FRACTION}
      BILLING_SUBSIDY_DISCOUNT_PCT: ${BILLING_SUBSIDY_DISCOUNT_PCT}
    volumes:
      - spark-checkpoints:/data/checkpoints
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Named volumes, not bind mounts, for service state. Named volumes are managed
# by Docker and behave identically on Windows, macOS and Linux — bind-mounting a
# database data directory from a Windows host is a well-known source of
# permission and fsync problems, and reproducibility across the marker's machine
# is exactly what is being assessed. `make clean` removes these.
# -----------------------------------------------------------------------------
  # ===========================================================================
  # PHASE 4 - serving layer (section 9)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # FastAPI serving layer. The read side of the Kappa architecture: it serves the
  # projections the Spark jobs write to Postgres and contains no business logic
  # of its own (see serving/api/main.py).
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: smartgrid-api:latest
    container_name: smartgrid-api
    depends_on:
      base-image:
        condition: service_completed_successfully
      # The API cannot serve any endpoint without the serving store, so it waits
      # for the SERVING database specifically (the healthcheck targets it, not
      # just the server), which also implies the init scripts have run.
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The API reports the simulated clock on /health and /pipeline/status, so
      # it needs the same clock configuration as every other service - a
      # divergence here would make the API disagree with the data it is serving.
      SIM_START_DATE: ${SIM_START_DATE}
      SIM_ANCHOR_REAL: ${SIM_ANCHOR_REAL}
      SIM_DAY_REAL_SECONDS: ${SIM_DAY_REAL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
    ports:
      - "${API_HOST_PORT}:8000"
    healthcheck:
      # Python rather than curl: the slim base image has no curl, and adding one
      # for a healthcheck would grow every service built on that base.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Grafana - the business dashboard deliverable (section 8, section 11 step 2).
  #
  # Datasource and dashboards are PROVISIONED from files rather than clicked
  # together in the UI. That is the difference between a dashboard that exists on
  # one laptop and one a marker gets by running `make up`, which is the
  # reproducibility property being assessed.
  #
  # It reads Postgres DIRECTLY rather than going through the API. Deliberate: the
  # panels are SQL aggregations over time ranges, which is what a SQL datasource
  # is for, and routing them through REST would mean inventing an endpoint per
  # panel. The API exists for programmatic consumers (section 9); Grafana is a SQL
  # client. Both read the same tables, so they cannot disagree.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: smartgrid-grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Anonymous viewer access: the demo and the marker should not have to log
      # in to see the dashboard. No authentication anywhere in this environment
      # is an explicit assumption (section 14), with production requirements noted
      # in the report.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      # Datasource credentials are interpolated into the provisioning YAML from
      # these, so the connection details live in .env like everything else.
      SERVING_DB_HOST: ${POSTGRES_HOST}
      SERVING_DB_PORT: ${POSTGRES_PORT}
      SERVING_DB_NAME: ${POSTGRES_DB}
      SERVING_DB_USER: ${POSTGRES_USER}
      SERVING_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    restart: unless-stopped


  # ===========================================================================
  # PHASE 5 - orchestration (section 7, section 10)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Airflow, running scheduler + webserver + API server in ONE container via
  # `airflow standalone`.
  #
  # WHY ONE CONTAINER AND NOT THE SEPARATE WEBSERVER/SCHEDULER OF section 4.2:
  # this host caps Docker at 3 GB (see the .wslconfig note) and already runs
  # eleven containers including three Spark drivers and a worker. The separate
  # topology costs roughly twice the memory, which in practice would mean
  # stopping job-b and job-c to run Airflow -- so the demo could not show the
  # stream and the orchestration alive at the same time, which is the one thing
  # the demo most needs to show.
  #
  # TRADE-OFF, stated in the report alongside the single Kafka broker: this is
  # not a production topology. There is no separate scheduler to fail over, no
  # worker pool, and LocalExecutor runs tasks as subprocesses of the scheduler.
  # Production would use CeleryExecutor or KubernetesExecutor with independent
  # scheduler and worker deployments.
  #
  # The METADATA database is the `airflow` Postgres database that
  # docker/postgres/init/01_create_databases.sh already creates -- not SQLite.
  # SQLite would force SequentialExecutor, which cannot run two tasks at once
  # and would make the DAG dependencies in this phase meaningless.
  # ---------------------------------------------------------------------------
  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: smartgrid-airflow:latest
    container_name: smartgrid-airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/orchestration/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      # One task at a time. The tasks are small, and on a memory-capped host a
      # burst of parallel tasks is the thing most likely to wedge Docker.
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      # The DAG files are scanned often; 30s keeps a code change visible in the
      # UI quickly without the scheduler re-parsing constantly.
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      # No authentication, consistent with the API and Kafka (assumption section 14).
      # Production requirements are noted in the report.
      AIRFLOW__WEBSERVER__AUTHENTICATE: "False"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.default
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # The serving store the DAGs read and write. Same variables every other
      # service uses, so the DAGs need no Airflow Connection configured through
      # the UI -- which would be state outside this repository and would break
      # reproducibility from a clean clone (section 13).
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The simulated clock. The DAGs derive their target sim_date from this,
      # NOT from Airflow's logical_date - Airflow schedules on real time and the
      # business day here is simulated, running 288x faster.
      SIM_START_DATE: ${SIM_START_DATE}
      SIM_ANCHOR_REAL: ${SIM_ANCHOR_REAL}
      SIM_DAY_REAL_SECONDS: ${SIM_DAY_REAL_SECONDS}
      REPORT_DIR: ${REPORT_DIR}
      DQ_MAX_REJECT_RATE_PCT: ${DQ_MAX_REJECT_RATE_PCT}
      DQ_MIN_METER_COVERAGE_PCT: ${DQ_MIN_METER_COVERAGE_PCT}
      DQ_EXPECTED_HOUSEHOLDS: ${DQ_EXPECTED_HOUSEHOLDS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      BILLING_BLOCK_KWH: ${BILLING_BLOCK_KWH}
      BILLING_TIER_1_RATE: ${BILLING_TIER_1_RATE}
      BILLING_TIER_2_RATE: ${BILLING_TIER_2_RATE}
      BILLING_TIER_3_RATE: ${BILLING_TIER_3_RATE}
      BILLING_TIER_4_RATE: ${BILLING_TIER_4_RATE}
      BILLING_EXPORT_CREDIT_FRACTION: ${BILLING_EXPORT_CREDIT_FRACTION}
      BILLING_SUBSIDY_DISCOUNT_PCT: ${BILLING_SUBSIDY_DISCOUNT_PCT}
    volumes:
      # The repository, read-only. Bind-mounted rather than copied so the DAGs
      # call the SAME processing/transforms/billing.py the Spark job does -- the
      # single-implementation claim is structural, not a promise.
      - ./common:/opt/project/common:ro
      - ./processing:/opt/project/processing:ro
      - ./orchestration:/opt/project/orchestration:ro
      - ./simulators:/opt/project/simulators:ro
      - ./.env:/opt/project/.env:ro
      # Report artifacts. A named volume so they survive a restart, which the
      # Phase 5 checkpoint ("a full sim-day produces a report file") needs.
      - report-data:/data/reports
    ports:
      - "${AIRFLOW_HOST_PORT}:8080"
    command: ["bash", "-c", "airflow db migrate && exec airflow standalone"]
    restart: unless-stopped


  # ===========================================================================
  # PHASE 6 - observability (section 8, a first-class deliverable worth 10 marks)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Prometheus. PULLS /metrics from every service rather than receiving pushes -
  # see the long note in observability/prometheus/prometheus.yml for why pull
  # beats a Pushgateway here (a pushed metric outlives its dead source, so "the
  # simulator stopped" would look identical to "the simulator is fine").
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: smartgrid-prometheus
    depends_on:
      alertmanager:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 24h is ample: the alert rules look back at most 10 minutes, and a long
      # retention on a 3 GB-capped host competes with Spark for memory.
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Alertmanager. Every alert routes to a receiver that does nothing, on purpose:
  # the assessed deliverable is that the RULES fire correctly (visible in this
  # UI, which is what section 11 step 6 demonstrates), and a real receiver would
  # need an SMTP password or a Slack webhook - committing one is a security
  # fault, requiring one breaks `make up` from a clean clone.
  #
  # The grouping and inhibition rules are NOT stubs and are worth defending: one
  # failure otherwise produces nine notifications describing one event.
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: smartgrid-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT}:9093"
    restart: unless-stopped


volumes:
  # Prometheus TSDB and Alertmanager's notification state. Named volumes so
  # a restart does not lose the series the alert rules evaluate over.
  prometheus-data:
  alertmanager-data:
  # Rendered billing reports (CSV + HTML) from daily_billing_report.
  # A named volume so a report survives a container restart, which the
  # Phase 5 checkpoint depends on.
  report-data:
  # Grafana's own state (its SQLite db). The dashboards themselves are
  # provisioned from files, so nothing here is a deliverable -- this only
  # stops Grafana re-initialising on every restart.
  grafana-data:
  kafka-data:
  postgres-data:
  objectstore-data:
  # The drop directory, shared between the tariff simulator (writer) and the
  # batch loader (reader). A named volume rather than a host bind mount: bind
  # mounts on Docker Desktop for Windows have inconsistent write-visibility
  # semantics between containers, which a file handoff cannot tolerate.
  drop-data:
  # Spark checkpoints: offsets plus the dedupe state store. On a named volume so a
  # restart resumes rather than reprocessing, which is the mechanism behind the
  # Phase 2 restart-idempotence checkpoint.
  spark-checkpoints:
  # Curated Parquet archive, partitioned by sim_date/grid_zone. A named volume; see
  # docs/ADR-004-parquet-sink.md for why not the S3-compatible store.
  curated-archive:
