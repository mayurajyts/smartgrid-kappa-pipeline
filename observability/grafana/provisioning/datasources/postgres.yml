# =============================================================================
# Serving-store datasource, provisioned from a file.
#
# WHY PROVISIONED AND NOT CLICKED TOGETHER IN THE UI: a datasource configured by
# hand exists on one laptop. This one exists for anyone who runs `make up`, which
# is the reproducibility property being assessed (plan section 13).
#
# Credentials are interpolated from the container's environment (set in
# docker-compose.yml from .env), so connection details live in one place with
# everything else rather than being duplicated here.
# =============================================================================
apiVersion: 1

datasources:
  - name: SmartGrid
    type: postgres
    uid: smartgrid-postgres
    access: proxy
    url: ${SERVING_DB_HOST}:${SERVING_DB_PORT}
    database: ${SERVING_DB_NAME}
    user: ${SERVING_DB_USER}
    secureJsonData:
      password: ${SERVING_DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      # Grafana will not run a query it thinks could return unbounded rows
      # without this; the zone table grows at ~5 rows per real minute so the cap
      # is generous.
      maxOpenConns: 4
      maxIdleConns: 2
      timescaledb: false
    isDefault: true
    editable: true

  # ---------------------------------------------------------------------------
  # Prometheus, for the PLATFORM dashboard (Phase 6). The business dashboard
  # reads Postgres (SQL aggregations over serving tables); the platform one reads
  # Prometheus (rates and histogram quantiles over counters). Two datasources
  # because they answer different questions, not because of duplication.
  # ---------------------------------------------------------------------------
  - name: Prometheus
    type: prometheus
    uid: smartgrid-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 10s
