# =============================================================================
# Prometheus scrape configuration (§8, Phase 6).
#
# WHY EACH SERVICE EXPOSES ITS OWN /metrics RATHER THAN PUSHING
# -------------------------------------------------------------
# §8 offers a choice — "a small HTTP server in the driver plus a
# StreamingQueryListener → push to Pushgateway (or expose from the foreachBatch
# sink process). Pick one and document it." This is the choice: every service
# runs `start_metrics_server()` from common/metrics.py and Prometheus pulls.
#
# Pull over push, for two reasons that matter here:
#   * A Pushgateway is a second stateful component, and a pushed metric persists
#     after its source dies — so "the meter simulator stopped" would look
#     identical to "the simulator is fine" until someone deleted the stale
#     series. Pull gives `up == 0` for free, which is the signal the
#     NoDataReceived rule needs.
#   * The Spark drivers are long-lived containers with stable DNS names in the
#     compose network, which is exactly the case pull is designed for. The
#     Pushgateway exists for batch jobs that exit before a scrape.
#
# 10s scrape interval: the §2.4 latency budget for the real-time path is under
# 10 seconds end to end, so a slower scrape would be the dominant term in
# "how quickly does the dashboard notice".
# =============================================================================
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    platform: smartgrid

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus itself — so a rule evaluation failure is visible.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The two data sources. `smartgrid_events_produced_total` and
  # `smartgrid_last_event_timestamp_seconds` come from here, and they are what
  # the staleness rule watches: if the simulator stops, these stop moving.
  - job_name: simulators
    static_configs:
      - targets:
          - "meter-simulator:8000"
          - "tariff-simulator:8000"
          - "batch-loader:8000"

  # The three streaming jobs. Each Spark DRIVER exposes the metrics (the
  # executors do not) — which is why these target the job containers rather
  # than spark-worker.
  #
  # NOTE the honest limitation, stated in the report: a metric incremented
  # inside foreachBatch runs on the driver, so these figures are driver-side
  # counts. Per-executor metrics would need a StreamingQueryListener pushing to
  # a gateway, which is the design rejected above.
  - job_name: streaming-jobs
    static_configs:
      - targets:
          - "job-a:8000"
          - "job-b:8000"
          - "job-c:8000"

  # The serving API, which exposes the SHARED registry from common/metrics.py
  # (see serving/api/main.py) rather than the prometheus-client default.
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
